<!DOCTYPE html>
<html>
<head>

    <title>Item Management</title>

    <link rel="stylesheet" href="/style.css">

</head>


<body>


<div class="container">

    <h1>Item Management</h1>


    <input id="itemId" placeholder="Item ID">

    <input id="itemName" placeholder="Item Name">

    <input id="itemPrice" placeholder="Price">

    <input id="itemQuantity" placeholder="Quantity">


    <button onclick="saveItem()">Add Item</button>

    <button onclick="updateItem()">Update Item</button>

    <button onclick="getItem()">Get Item By ID</button>

    <button onclick="getAllItems()">Show All Items</button>

    <button onclick="deleteItem()">Delete Item</button>


    <div id="result"></div>


</div>


<script src="/script.js"></script>


</body>
</html>
